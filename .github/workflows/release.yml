name: Release

# Driven by a tag, so what is released is always a commit in the history.
# Shaped after stfc/goldilocks-ml's release workflow, without the PyPI upload:
# this package is installed from the tag.
on:
  push:
    tags:
      # After vMajor.Minor.Patch anything is allowed, except "/".
      - v[0-9]+.[0-9]+.[0-9]+*

jobs:
  release:
    runs-on: ubuntu-latest
    # A fork that pushes a tag must not try to release.
    if: github.repository == 'stfc/goldilocks-data'
    permissions:
      # For creating the GitHub release.
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      # A tag that disagrees with the packaged version publishes a release
      # nobody can find from the history.
      - name: Check the tag matches the packaged version
        run: |
          packaged=$(uvx --from=toml-cli toml get --toml-path=pyproject.toml project.version)
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$packaged" != "$tagged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $packaged"
            exit 1
          fi

      # A tag can point at any commit, not only one CI has already seen.
      - name: Test
        run: |
          uv sync --frozen --group dev
          uv run --frozen pytest

      - name: Build
        run: uv build

      - name: Check the artifacts are well formed
        run: uvx twine check --strict dist/*

      - name: Create the GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          artifacts: "dist/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          skipIfReleaseExists: true
          generateReleaseNotes: true
