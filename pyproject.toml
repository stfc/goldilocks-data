[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goldilocks-data"
version = "0.1.0"
description = "Reusable data-side tooling for Goldilocks DFT sweeps."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
]

[project.optional-dependencies]
aiida = [
    "aiida-core>=2.6",
    "aiida-quantumespresso",
]
kmesh = [
    "pyarrow>=15",
    "pymatgen>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]

[project.scripts]
goldilocks-data = "goldilocks_data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/goldilocks_data"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
