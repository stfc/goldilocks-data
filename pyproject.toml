[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goldilocks-data"
version = "0.1.0"
description = "Reusable data-side tooling for Goldilocks DFT sweeps."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Alin-Marin Elena" },
    { name = "Junwen Yin" },
    { name = "Susmita Basak" },
    { name = "Jaehoon Cha" },
    { name = "Gilberto Teobaldi" },
]
maintainers = [{ name = "Junwen Yin" }]
keywords = [
    "aiida",
    "convergence",
    "density-functional-theory",
    "dft",
    "k-points",
    "materials-science",
    "quantum-espresso",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "pandas>=2.2",
    # kmesh reads the reciprocal lattice throughout and reduces every mesh by
    # symmetry, so a caller already needs a pymatgen Structure. Optional only in
    # name.
    "pymatgen>=2024.1",
]

[project.optional-dependencies]
aiida = [
    "aiida-core>=2.6",
    "aiida-quantumespresso",
]
kmesh = [
    "pyarrow>=15",
]
publish = [
    "data-collections-api==0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
]

[project.urls]
Homepage = "https://stfc.github.io/goldilocks-data/"
Documentation = "https://stfc.github.io/goldilocks-data/"
Repository = "https://github.com/stfc/goldilocks-data"
Issues = "https://github.com/stfc/goldilocks-data/issues"
Changelog = "https://github.com/stfc/goldilocks-data/blob/main/CHANGELOG.md"

[project.scripts]
goldilocks-data = "goldilocks_data.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/goldilocks_data"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
